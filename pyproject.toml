[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataatelier"
version = "0.1.0"
description = "A human-in-the-loop data cleansing tool for Azure Blob Storage that leverages LLMs for scale"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "DataAtelier Contributors"}
]
dependencies = [
    "azure-storage-blob>=12.19.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "chardet>=5.0.0",
    "rich>=13.0.0",
    "textual>=0.47.0",
    "typer>=0.9.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
document = [
    "pdfminer.six>=20221105",
    "python-docx>=1.0.0",
]

[project.scripts]
blob-cleanup = "azure_blob_cleanup_tui:main"

[tool.setuptools]
packages = ["lib"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"
